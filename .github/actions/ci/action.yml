name: CI

description: Shared action to install dependencies

inputs:
  runtime:
    description: |
      Runtime to install, in `<name>@<version>` form (e.g. `node@26`).
      When omitted, `pnpm/setup` reads `devEngines.runtime` from package.json.
    required: false

runs:
  using: composite

  steps:
    - name: Setup pnpm with runtime
      uses: pnpm/setup@v2
      with:
        cache: true
        runtime: ${{ inputs.runtime }}

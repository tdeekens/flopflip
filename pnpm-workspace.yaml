packages:
  - packages/*
  - tooling/*
catalog:
  '@babel/runtime': 8.0.5
  '@launchdarkly/js-client-sdk': 4.10.3
  '@testing-library/dom': 10.4.1
  '@testing-library/jest-dom': 7.0.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  globalthis: 1.0.4
  lodash: 4.18.1
  mitt: 3.0.1
  react: 19.3.0
  react-dom: 19.3.0
  tiny-warning: 1.0.3
  ts-deepmerge: 8.0.0
  tsdown: 0.23.0
  typescript: 7.0.2
  vitest: 4.1.11
overrides:
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'
patchedDependencies:
  cypress@13.6.4: patches/cypress@13.6.4.patch
allowBuilds:
  core-js: true
  cypress: true
  esbuild: true
peerDependencyRules:
  allowedVersions:
    'tsdown>typescript': '7'
autoDedupe: true
minimumReleaseAge: 1440
publishWaitTimeout: 300000
tasks:
  build:
    dependsOn: ['^build']
    outputs: ['dist/**']
  check-types:
    dependsOn: ['^build']
    outputs: []
  test:
    dependsOn: ['^build']
    outputs: []
pipelines:
  build: [build]
  check-types: [check-types]
  test: [test]
blockExoticSubdeps: true
trustPolicy: no-downgrade
